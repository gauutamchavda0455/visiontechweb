<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VisionTech logo">
  <defs>
    <linearGradient id="vt_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#6EE7F9"/>
    </linearGradient>
    <filter id="vt_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#vt_grad)" filter="url(#vt_shadow)"/>
  <!-- Monogram VT -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- V -->
    <path d="M140 160 L208 352 L276 160" stroke-width="36"/>
    <!-- T -->
    <path d="M312 160 H404" stroke-width="36"/>
    <path d="M358 160 V336" stroke-width="36"/>
  </g>
